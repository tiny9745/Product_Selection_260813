plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	// 將Java專案當為web的套件
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// 右鍵 > Gradle > Refresh Gradle Project 來進行更新下載
	// spring data jpa(版本號可省略，依據 id 'org.springframework.boot' 的 version 注入)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// mysql connector: mysql 驅動
	implementation 'com.mysql:mysql-connector-j'

	// security
    implementation 'org.springframework.boot:spring-boot-starter-security'

	// 資料驗證
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 商品相似度比對：RESALE 商品搜尋候選參考商品用（Jaro-Winkler 演算法）
	// 不在 Spring Boot BOM 管理範圍內，需自行指定版本
	implementation 'org.apache.commons:commons-text:1.13.0'

	// JWT：簽發/解析 Access Token
	// 這三個是 io.jsonwebtoken 自家的模組，不在 Spring Boot BOM 管理範圍內，需自行指定版本
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	// jjwt-jackson 讓 jjwt 用 Jackson 做 JSON 序列化，與 spring-boot-starter-web 內建的 Jackson 相容
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Spring Boot 4 預設改走 Jackson 3（tools.jackson.*），compile classpath
	// 不再提供 com.fasterxml.jackson.databind。WeatherClient / Gemini /
	// RestSecurityHandlers 仍用 Jackson 2 API，必須顯式加入，否則連編譯都過不了。
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.4'

	// 程式碼修改後儲存會自動重啟 Application(不一定成功)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// Spring Boot 讀專案根目錄的 .env
	developmentOnly 'me.paulschwarz:springboot4-dotenv:5.1.0'
	
	// db flyway
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	
	// WebP 圖片解碼：javax.imageio 沒有內建 WebP 支援（JDK 只內建 JPEG/PNG/GIF/BMP/WBMP），
	// ProductService.uploadImage() 的 ImageIO.read() 對真正的 WebP 檔案一律回傳 null，
	// 被誤判成「檔案內容不是合法的圖片格式」而拒絕——即使前端 accept 清單、後端副檔名白名單
	// 都寫著支援 webp。純 Java 實作（不需要額外的作業系統原生函式庫），透過
	// META-INF/services 的 SPI 機制自動註冊給 ImageIO 用，不需要修改呼叫 ImageIO 的程式碼。
	implementation 'org.sejda.imageio:webp-imageio:0.1.6'
}

tasks.named('test') {
	useJUnitPlatform()
}
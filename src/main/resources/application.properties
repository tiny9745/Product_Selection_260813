spring.application.name=Product_Selection_260813

spring.datasource.url=jdbc:mysql://localhost:3306/product_selection_260813?serverTimezone=Asia/Taipei&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Demo1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:CHANGE_ME_to_a_random_string_at_least_32_bytes_long}
jwt.expiration-ms=28800000

## warning:
## This code is intended solely for testing purposes (development environment; not deployed).
## It must be removed when using a production domain (HTTPS) or deploying the application.
cookie.secure=false




### File Upload Settings
# Maximum size of a single file
spring.servlet.multipart.max-file-size=5MB

# Maximum size of the entire multipart request
spring.servlet.multipart.max-request-size=5MB

### Product Image Storage
# Relative path for uploaded product images
app.upload.dir=./uploads/products

### Gemini LLM 設定（POST /api/products/{id}/ai-analysis/generate 使用）
# API Key不直接寫死，比照jwt.secret的做法改由環境變數來注入：
# Windows: setx GEMINI_API_KEY "your-key-here"
# Eclipse: Run Configurations > Environment 新增 GEMINI_API_KEY
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash
gemini.timeout-seconds=30

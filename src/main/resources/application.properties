spring.application.name=Product_Selection_260813

spring.datasource.url=${DB_URL}?serverTimezone=Asia/Taipei&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

## warning:
## This code is intended solely for testing purposes (development environment; not deployed).
## It must be removed when using a production domain (HTTPS) or deploying the application.
cookie.secure=${COOKIE_SECURE:true}


### Pagination Settings
# 分頁上限：@PageableDefault(size = 20) 只設預設值，不限制呼叫端可送的 size。
# 未設上限時 ?size=100000 會一次撈出全表，配合 ProductService 內的
# resolveCreatedByNames() / resolveEvaluations() 批次查詢會造成明顯的記憶體與 DB 壓力。
spring.data.web.pageable.max-page-size=100

### File Upload Settings
# Maximum size of a single file
# 單檔限制維持 5MB 不變，單筆 POST /api/products/{id}/image 與批次
# POST /api/products/batch 內每一個圖片檔案都受這個上限約束。
spring.servlet.multipart.max-file-size=5MB

# Maximum size of the entire multipart request
# 原本 5MB 是配合「單筆新增最多帶一張圖」估的整包上限。批次新增
# POST /api/products/batch 一次 request 可能同時夾帶到 200 列的 items
# JSON 加上數十張圖片檔案，5MB 會讓批次功能還沒進到 Controller 就先被
# Servlet 容器擋下（回一個不易理解的 multipart 例外，而不是 ApiResponse
# 格式的錯誤訊息），因此調高整包上限；單檔仍受上面 max-file-size=5MB
# 個別限制，不會因為這裡調高就允許單一圖片超過 5MB。
spring.servlet.multipart.max-request-size=100MB

### Product Image Storage
# Relative path for uploaded product images
app.upload.dir=${APP_UPLOAD_DIR}

### Gemini LLM 設定（POST /api/products/{id}/ai-analysis/generate 使用）
# API Key不直接寫死，比照jwt.secret的做法改由環境變數來注入：
# Windows: setx GEMINI_API_KEY "your-key-here"
# Eclipse: Run Configurations > Environment 新增 GEMINI_API_KEY
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash
gemini.timeout-seconds=90

### Open-Meteo 天氣預報設定（WeatherCampaignSyncService／OpenMeteoWeatherSignalProvider 使用）
# Open-Meteo為免費公開API，非商業用途不需要API Key，故這裡沒有xxx.api-key設定
# forecast-days：要跟Open-Meteo要幾天的每日預報，上限16天（Open-Meteo forecast_days參數限制）
# 預設14天＝WeatherForecastConfidence的HIGH(0~7天)+MEDIUM(8~14天)涵蓋範圍，見WeatherNormalizer
weather.forecast-days=${WEATHER_FORECAST_DAYS:14}
# history-cold-start-threshold-days：某區歷史窗口內的天數少於此值時，下次同步補齊整段歷史。
# 2026-09-26：預設＝history-days（30 天，缺任何一天就補）；大於 history-days 時以 history-days 為準。
weather.history-cold-start-threshold-days=${WEATHER_HISTORY_COLD_START_THRESHOLD_DAYS:30}
weather.timeout-seconds=${WEATHER_TIMEOUT_SECONDS:15}

### PTT 討論量爬蟲設定（TrendService／PttMarketBuzzProvider 使用）
# 只抓公開、免登入、不需「已滿18歲」確認的看板；需要確認的看板會被略過（不繞過）
# boards：要搜尋的看板（逗號分隔）；window-days：討論量統計窗口；recent-days：判斷近期動能的窗口
# max-pages-per-board：每個看板最多翻幾頁搜尋結果（每頁20篇）；request-delay-ms：每次請求間隔，避免造成PTT負擔
# reference-volume：「一般商品」的討論量，對應50分；hot-volume：到達100分的討論量（依2026-09實測資料校準，見MarketBuzzNormalizer）
ptt.boards=${PTT_BOARDS:Lifeismoney,e-shopping,Food,cookclub,e-appliance,PC_Shopping,MobileComm}
ptt.window-days=${PTT_WINDOW_DAYS:90}
ptt.recent-days=${PTT_RECENT_DAYS:7}
ptt.max-pages-per-board=${PTT_MAX_PAGES_PER_BOARD:5}
ptt.request-delay-ms=${PTT_REQUEST_DELAY_MS:1000}
ptt.timeout-seconds=${PTT_TIMEOUT_SECONDS:10}
ptt.reference-volume=${PTT_REFERENCE_VOLUME:20}
ptt.hot-volume=${PTT_HOT_VOLUME:1000}

### Groq LLM 設定（2026-09-29，只供 PTT 新品探索使用；單一商品 AI 分析仍用上面的 gemini.*）
# Gemini 的 503 是 Google 端過載，探索改用 Groq 免費方案（不拿 API 資料訓練、OpenAI 相容格式）。
# API Key 比照 GEMINI_API_KEY 由環境變數（或專案根目錄 .env）注入，不寫死、不進 Git：
# Windows: setx GROQ_API_KEY "gsk_..."；Eclipse: Run Configurations > Environment 新增 GROQ_API_KEY
# model 必須支援 strict structured outputs（2026-09：openai/gpt-oss-120b、openai/gpt-oss-20b）
# 免費方案 openai/gpt-oss-120b：每分鐘 30 次、8K tokens；每天 1K 次、200K tokens。
# 單一請求的「輸入 + max-completion-tokens」超過每分鐘 8K 會被拒（413），調整每批數量時要一起考慮
# reasoning-effort：gpt-oss 的推理強度（low/medium/high），推理 token 也算在輸出上限與額度內；換成非 gpt-oss 模型時留空
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:60}
groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:3000}
groq.reasoning-effort=${GROQ_REASONING_EFFORT:low}

# PTT 新品探索（2026-09-29，每天 01:30）：看板沿用上面的 ptt.boards，AI 用 groq.*；
# 探索專用的每月 AI 呼叫上限在 system_settings.discovery_ai_monthly_limit（預設 1000，失控保護用）
# 每批數量依 Groq 每分鐘 8K tokens 估算：80 則標題約 3.5K 輸入＋3K 輸出上限；AI 階段約每分鐘一批
discovery.recent-days=${DISCOVERY_RECENT_DAYS:7}
discovery.max-index-pages-per-board=${DISCOVERY_MAX_INDEX_PAGES_PER_BOARD:30}
discovery.titles-per-ai-call=${DISCOVERY_TITLES_PER_AI_CALL:80}
discovery.max-ai-calls-per-run=${DISCOVERY_MAX_AI_CALLS_PER_RUN:30}
discovery.max-buzz-checks-per-run=${DISCOVERY_MAX_BUZZ_CHECKS_PER_RUN:10}
# 第二階段：適配評分（Groq，與抽取共用探索額度）與 Google 趨勢交叉驗證（SerpApi，與商品的 Google 趨勢共用額度）
discovery.max-fit-evaluations-per-run=${DISCOVERY_MAX_FIT_EVALUATIONS_PER_RUN:40}
discovery.items-per-fit-call=${DISCOVERY_ITEMS_PER_FIT_CALL:10}
discovery.max-google-checks-per-run=${DISCOVERY_MAX_GOOGLE_CHECKS_PER_RUN:5}
# AI 暫時性錯誤（429、5xx、逾時）的重試：最多嘗試次數（含第一次）與 5xx 第一次重試前的等待（之後每次乘 3）；
# 429 依 Groq 的 retry-after 等待，需要等超過 max-rate-limit-wait-seconds（通常是每日額度用完）就停止本次後續 AI 呼叫
discovery.ai.max-attempts=${DISCOVERY_AI_MAX_ATTEMPTS:4}
discovery.ai.retry-backoff-ms=${DISCOVERY_AI_RETRY_BACKOFF_MS:5000}
discovery.ai.max-rate-limit-wait-seconds=${DISCOVERY_AI_MAX_RATE_LIMIT_WAIT_SECONDS:90}

### Google 趨勢參考（SerpApi，GoogleTrendService／SerpApiTrendInterestProvider 使用）
# 獨立參考資訊，不併入熱度分數；來源開關在系統設定（預設停用），每月上限在 system_settings.serpapi_monthly_limit（預設 200）
# API Key 比照 GEMINI_API_KEY 由環境變數注入，不寫死、不進 Git：
# Windows: setx SERPAPI_API_KEY "your-key-here"（或「編輯您帳戶的環境變數」）
# Eclipse: Run Configurations > Environment 新增 SERPAPI_API_KEY
serpapi.api-key=${SERPAPI_API_KEY:}
serpapi.geo=${SERPAPI_GEO:TW}
serpapi.timeout-seconds=${SERPAPI_TIMEOUT_SECONDS:30}
# batch-size：每週批次查詢 PTT 熱度前幾名（40 名 × 每週 1 次 ≈ 每月 170 次，在免費 250 次內）
google-trends.batch-size=${GOOGLE_TRENDS_BATCH_SIZE:40}
google-trends.request-delay-ms=${GOOGLE_TRENDS_REQUEST_DELAY_MS:2000}

# flyway 的啟用
# Baseline 成功後，將spring.flyway.baseline-on-migrate從true改成false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial schema

spring.jpa.hibernate.ddl-auto=validate
